[package]
name = "tj-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast cross-platform shell tools for agentic programming: cr (resume Claude/Codex sessions) and f (fuzzy cd)."
repository = "https://github.com/tj-agents/cli"
publish = false

[[bin]]
name = "tj"
path = "src/main.rs"

[[bin]]
name = "tj_hook"
path = "src/bin/tj_hook.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
rayon = "1"
regex = "1"
serde_json = "1"
terminal_size = "0.4"
walkdir = "2"
which = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
