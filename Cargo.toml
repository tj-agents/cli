[package]
name = "tj-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Managed Claude Code and Codex sessions with native terminal interfaces, completion receipts, session search and shell navigation."
repository = "https://github.com/tj-agents/cli"
publish = false

[[bin]]
name = "tj"
path = "src/main.rs"

[[bin]]
name = "tj_hook"
path = "src/bin/tj_hook.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs4 = "1.1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
rayon = "1"
regex = "1"
serde_json = "1"
terminal_size = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2.5.8"
walkdir = "2"
which = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
