name: structure-qualification

on:
  pull_request:
  push:
    branches: [Refactor/SubjectSkillLayout]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    uses: tj-agents/template/.github/workflows/plugin-ci.yml@4bf5aaeb29f2b57e933505c36f8bf8128f5cabe1
    with:
      template_ref: 4bf5aaeb29f2b57e933505c36f8bf8128f5cabe1
    secrets:
      read_token: ${{ secrets.TJ_AGENTS_READ_TOKEN }}
