name: structure-qualification

on:
  pull_request:
  push:
    branches: [Refactor/SubjectSkillLayout]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    uses: tj-agents/template/.github/workflows/plugin-ci.yml@7583dede1853a92451abebf5742385a99b97d9a8
    with:
      template_ref: 7583dede1853a92451abebf5742385a99b97d9a8
    secrets:
      read_token: ${{ secrets.TJ_AGENTS_READ_TOKEN }}
