name: Release native CLI

on:
  workflow_run:
    workflows: [ci, Rust CI]
    types: [completed]

concurrency:
  group: native-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    # A completed own-repository push run is the only trusted release signal. The
    # other workflow can complete later, so its completion gets a fresh qualifier.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.qualify.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: packages/tj-cli/src
        run: python -m tj_cli.native_release

  build:
    needs: qualify
    if: needs.qualify.outputs.sha != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.qualify.outputs.sha }}
          persist-credentials: false
      - name: install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked
      - name: package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf tj-${{ matrix.target }}.tar.gz -C target/release tj tj_hook
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/tj.exe,target/release/tj_hook.exe -DestinationPath tj-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tj-${{ matrix.target }}
          path: tj-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [qualify, build]
    if: needs.qualify.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: publish exact current main revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.qualify.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$REPOSITORY" --jq .default_branch)"
          current_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/$default_branch" --jq .object.sha)"
          if [ "$current_sha" != "$SHA" ]; then
            echo "superseded $SHA; current $default_branch is $current_sha"
            exit 0
          fi
          tag="main-$SHA"
          release="$(gh release view "$tag" --repo "$REPOSITORY" --json isDraft,targetCommitish,assets 2>/dev/null || true)"
          if [ -n "$release" ]; then
            target="$(jq -r .targetCommitish <<<"$release")"
            draft="$(jq -r .isDraft <<<"$release")"
            if [ "$target" != "$SHA" ]; then
              echo "release $tag has an unexpected target $target" >&2
              exit 1
            fi
            if [ "$draft" != true ]; then
              echo "release $tag is already published"
              exit 0
            fi
          else
            gh release create "$tag" --repo "$REPOSITORY" --target "$SHA" --draft --title "$tag" --notes "Native binaries for $SHA"
            release='{"assets":[]}'
          fi
          for asset in tj-x86_64-unknown-linux-gnu.tar.gz tj-x86_64-pc-windows-msvc.zip; do
            # Only an unpublished draft may be resumed. Replace its assets with
            # this qualified build before making either platform visible.
            gh release upload "$tag" "$asset" --repo "$REPOSITORY" --clobber
          done
          current_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/$default_branch" --jq .object.sha)"
          if [ "$current_sha" != "$SHA" ]; then
            echo "superseded during upload; leaving $tag unpublished"
            exit 0
          fi
          gh release edit "$tag" --repo "$REPOSITORY" --draft=false --latest
