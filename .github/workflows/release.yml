name: Release

# Push a tag like v0.2.0 to publish prebuilt binaries; the installers download them when cargo is absent.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf tj-${{ matrix.target }}.tar.gz -C target/release tj
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/tj.exe -DestinationPath tj-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tj-${{ matrix.target }}
          path: tj-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tj-* --repo "$GITHUB_REPOSITORY" --generate-notes
