name: Publish update
on:
  push:
permissions:
  contents: read
concurrency:
  group: publish-update-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: vars.UPDATE_TOPIC != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish repository hint
        uses: tj-agents/github-actions/.github/actions/publish-update@ef03e0aaa9bdaca8be97c0fa7a5a077d2b62a78a
        with:
          topic: ${{ secrets.UPDATE_TOPIC }}
