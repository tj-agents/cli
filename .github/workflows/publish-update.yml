name: Publish update
on:
  push:
permissions:
  contents: read
concurrency:
  group: publish-update-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: vars.UPDATE_TOPIC != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish repository hint
        uses: tj-agents/github-actions/.github/actions/publish-update@5a6f33967ce83a07c7eb1b7f7b4fc1d71e771b02
        with:
          topic: ${{ secrets.UPDATE_TOPIC }}
