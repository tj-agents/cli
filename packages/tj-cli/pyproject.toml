[project]
name = "tj-cli"
version = "0.1.0"
description = "Reusable CLI and operating-system mechanics for TJ Agents"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.py" },
  { file = "src/**/*.ps1" },
  { file = "src/**/*.json" },
  { file = "src/**/py.typed" },
]
