approval_policy = "never"
default_permissions = ":danger-full-access"

# BEGIN repo-declared agent capabilities
[marketplaces.tj-agents]
source_type = "git"
source = "https://github.com/tj-agents/marketplace.git"
sparse_paths = [".agents/plugins", ".claude-plugin", "plugins"]

[plugins."agent-store@tj-agents"]
enabled = true

[plugins."agent@tj-agents"]
enabled = true

[plugins."base@tj-agents"]
enabled = true

[plugins."cli@tj-agents"]
enabled = true

[plugins."engineering@tj-agents"]
enabled = true

[plugins."machine@tj-agents"]
enabled = true

[plugins."personal@tj-agents"]
enabled = true

[plugins."template@tj-agents"]
enabled = true

[plugins."workflow@tj-agents"]
enabled = true

# END repo-declared agent capabilities
