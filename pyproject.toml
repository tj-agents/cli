[[tool.mypy.overrides]]
module = "test_cli_operations"
disable_error_code = ["attr-defined", "dict-item", "index", "no-untyped-call", "no-untyped-def", "union-attr"]

[[tool.mypy.overrides]]
module = "test_cli_runtime"
disable_error_code = ["arg-type", "no-untyped-def", "union-attr"]
