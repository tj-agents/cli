[project]
name = "tj-cli-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/tj-cli"]

[tool.uv.sources]
tj-cli = { workspace = true }

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.ruff]
include = ["packages/tj-cli/**/*.py"]
src = ["packages/tj-cli/src"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
"packages/tj-cli/src/tj_cli/process/identity.py" = ["N818"]
"packages/tj-cli/src/tj_cli/close.py" = ["UP036"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["packages/tj-cli/src", "packages/tj-cli/tests"]

[tool.pytest]
strict = true
testpaths = ["packages/tj-cli/tests", ".agents/tests", "tests/test_cli_operations.py"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
