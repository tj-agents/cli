[project]
name = "tj-cli-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/tj-cli"]

[tool.uv.sources]
tj-cli = { workspace = true }

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.1.1", "ruff>=0.17.4", "pytest-socket>=0.7.0"]

[tool.ruff]
extend-exclude = [".agents/sync_generated.py", ".agents/dependencies", ".codex/skills", ".claude/skills", ".codex/hooks/snapshot.py", ".codex/hooks/bootstrap.py", ".worktrees", ".template", "plugins"]
include = ["*.py", "*.pyi"]
src = ["packages/tj-cli/src"]
target-version = "py312"

[tool.ruff.lint]
explicit-preview-rules = true
preview = true
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF", "PGH004", "ANN401", "G004", "PLW1514", "LOG002", "LOG015", "PLC2701", "ICN001", "TID251", "TRY300", "PT009", "PT011", "PT006", "PLR6301"]

[tool.mypy]
enable_error_code = ["ignore-without-code", "exhaustive-match"]
strict = true
warn_unreachable = true
files = [
    "packages/tj-cli/src",
    "packages/tj-cli/tests",
    ".agents",
    "tests",
]

[tool.pytest]
strict = true
testpaths = ["packages/tj-cli/tests", ".agents/tests", "tests/test_cli_operations.py"]
addopts = ["--import-mode=importlib", "-ra", "--disable-socket"]
filterwarnings = ["error"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase" = { "msg" = "Use plain pytest functions and bare assertions." }
"importlib.util.spec_from_file_location" = { "msg" = "Import the installed public API; do not load another checkout by path." }
"sys.path" = { "msg" = "Install the declared dependency; do not modify the import search path." }

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

[tool.ruff.lint.per-file-ignores]
"packages/tj-cli/tests/test_handy_install.py" = ["ANN401"]
"packages/tj-cli/tests/process/test_execution.py" = ["PT011"]
"packages/tj-cli/tests/clipboard/test_windows_clipboard.py" = ["PLC2701", "PLR6301"]
"packages/tj-cli/tests/clipboard/test_text.py" = ["PLC2701"]
"packages/tj-cli/tests/clipboard/test_posix.py" = ["PLC2701"]
"packages/tj-cli/tests/clipboard/test_guard.py" = ["PLC2701"]
"packages/tj-cli/src/tj_cli/native_install.py" = ["TRY300"]
"packages/tj-cli/src/tj_cli/clipboard/_windows.py" = ["ANN401"]
"packages/tj-cli/src/tj_cli/__init__.py" = ["F822"]

[[tool.python-standards.exceptions]]
path = "packages/tj-cli/src/tj_cli/clipboard/__init__.py"
rule = "PY008"
reason = "Legacy package initializer imports private implementation names for its public API."

[[tool.python-standards.exceptions]]
path = "packages/tj-cli/src/tj_cli/clipboard/_guard.py"
