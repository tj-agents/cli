".agents/tests/test_cli_runtime.py" = ["E501", "I001", "TID251"]
".agents/tests/test_copy_draft.py" = ["E501", "TID251"]
"tests/fixtures/dummy_agent.py" = ["E501", "PTH109", "PTH123"]
"tests/fixtures/fake_codex.py" = ["B905", "E501", "PTH123"]
"tests/fixtures/fake_inbox.py" = ["E501", "PLC2701", "PLW1514", "PTH123"]
"tests/test_cli_operations.py" = ["E402", "I001", "PT009", "TID251"]

[tool.ruff.format]
exclude = [
  ".agents/cli/utility/clip/scripts/copy_draft.py",
  ".agents/tests/test_cli_runtime.py",
  ".agents/tests/test_copy_draft.py",
  "tests/fixtures/dummy_agent.py",
  "tests/fixtures/fake_codex.py",
]

[[tool.mypy.overrides]]
module = "dummy_agent"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "fake_codex"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "fake_inbox"
